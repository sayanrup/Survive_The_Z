<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Survive The Z</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="start-screen" class="screen">
    <div class="start-card">
      <h1>Survive The Z</h1>
      <p class="tagline">A turn-based zombie survival RPG. Scavenge, craft, fight, and stay alive.</p>
      <label for="player-name">Survivor name</label>
      <input type="text" id="player-name" maxlength="20" placeholder="Survivor" />
      <div class="start-buttons">
        <button data-action="new-game">New Game</button>
        <button id="continue-btn" data-action="continue-game" hidden>Continue</button>
      </div>
      <p class="copyright">&copy; 2026 Sayan - an AI-enthusiastic PM</p>
    </div>
  </div>

  <div id="game-screen" class="screen" hidden>
    <header id="game-header">
      <h1>Survive The Z</h1>
      <div id="day-counter">Day 1</div>
    </header>

    <div id="game-container">
      <aside id="stats-panel" class="panel"></aside>

      <main id="main-panel">
        <section id="location-panel" class="panel"></section>
        <section id="action-panel" class="panel"></section>
        <section id="log-panel" class="panel"></section>
      </main>

      <aside id="inventory-panel" class="panel"></aside>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
